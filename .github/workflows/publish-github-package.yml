name: Publish to GitHub Packages & Releases

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-gpr:
    name: Publish Release & @imdvlpr99/nativra-cli to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@imdvlpr99"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI and internal packages
        run: |
          pnpm --filter @nativra/registry-builder... build
          pnpm --filter nativra-cli... build
          node scripts/build-registry.mjs

      - name: Typecheck and test CLI
        run: |
          pnpm --filter nativra-cli typecheck
          pnpm --filter nativra-cli test

      - name: Pack CLI tarball and create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd packages/cli
          TGZ=$(npm pack --silent)
          cd ../..
          node scripts/extract-release-notes.mjs "$TAG" /tmp/release-notes.md
          TITLE=$(cat /tmp/release-title.txt 2>/dev/null || echo "$TAG")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "packages/cli/$TGZ" "dist/registry/registry.json" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md
          else
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "packages/cli/$TGZ" "dist/registry/registry.json" --clobber || true
          fi

      - name: Prepare package.json for GitHub Packages (@imdvlpr99/nativra-cli)
        working-directory: packages/cli
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@imdvlpr99/nativra-cli";
            pkg.publishConfig = {
              registry: "https://npm.pkg.github.com",
              access: "public"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Publish to GitHub Packages
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks || true
