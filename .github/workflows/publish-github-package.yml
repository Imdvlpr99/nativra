name: Publish to GitHub Packages & Releases

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-gpr:
    name: Publish Release & @imdvlpr99/nativra-cli to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@imdvlpr99"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI and internal packages
        run: |
          pnpm --filter @nativra/registry-builder... build
          pnpm --filter nativra-cli... build
          node scripts/build-registry.mjs

      - name: Typecheck and test CLI
        run: |
          pnpm --filter nativra-cli typecheck
          pnpm --filter nativra-cli test

      - name: Pack CLI tarball and create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd packages/cli
          TGZ=$(npm pack --silent)
          cd ../..
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "packages/cli/$TGZ" "dist/registry/registry.json" \
              --title "$TAG — Security, Registry & Dependency Hardening" \
              --notes "## 🛡️ Nativra $TAG — Security, Registry & Dependency Hardening

### 🔒 Security & Supply-Chain Hardening
- **Path Traversal & Symlink Protection (\`nativra-cli\`)**: Enforced strict project-root (\`cwd\`) containment and symlink rejection across \`nativra add\`, \`nativra update\`, \`nativra remove\`, \`nativra rollback\`, and \`nativra theme add\`.
- **Portable Lockfile Paths**: \`nativra.lock.json\` now records portable POSIX project-relative file keys (while seamlessly migrating legacy entries).
- **Mandatory SHA-256 Verification & HTTPS Enforcement**: \`@nativra/registry-client\` now requires valid SHA-256 hashes for all hydrated source files and validates item IDs prior to file/URL resolution; remote registries require \`https://\`.
- **Backup Integrity Verification**: \`nativra rollback\` now validates backup SHA-256 digests before restoring files.
- **Zero Dependency Advisories**: Upgraded \`zod\`, \`vitest\`, \`vite\`, and \`postcss\` and configured patched \`pnpm.overrides\` (\`pnpm audit\` reports **0 vulnerabilities**, down from 59).

### 📦 Registry & Configuration Fixes
- **Live Registry Default URL**: Updated default registry base URL across \`nativra-cli\`, \`@nativra/registry-schema\`, and example configurations to \`https://nativra.vercel.app\`.
- **Complete Dependency Declarations**: Added missing \`cn\` utility and \`class-variance-authority\` dependency declarations across \`fab\`, \`icon-button\`, \`stack\`, \`bottom-sheet\`, \`otp-input\`, \`safe-area\`, \`auth-flow\`, \`onboarding-flow\`, and \`settings-flow\`."
          fi

      - name: Prepare package.json for GitHub Packages (@imdvlpr99/nativra-cli)
        working-directory: packages/cli
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@imdvlpr99/nativra-cli";
            pkg.publishConfig = {
              registry: "https://npm.pkg.github.com",
              access: "public"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Publish to GitHub Packages
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks || true
