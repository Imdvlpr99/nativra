name: Publish to GitHub Packages & Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Each job asks for only what it needs.
permissions: {}

jobs:
  publish-gpr:
    name: Publish Release & @imdvlpr99/nativra-cli to GitHub Packages
    # Only a v* tag may publish: a manual run must be started on a tag (Use workflow from > Tags),
    # so a branch can never ship an unverified version.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dependency install scripts run below; don't leave a write-scoped token in .git/config.
          # The steps that need the token get it explicitly through env.
          persist-credentials: false

      # The tag is the release's identity: refuse to publish if it disagrees with the CLI version.
      - name: Verify tag matches CLI version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match packages/cli/package.json version $VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@imdvlpr99"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI and internal packages
        run: |
          pnpm --filter @nativra/registry-builder... build
          pnpm --filter nativra-cli... build
          node scripts/build-registry.mjs

      - name: Typecheck and test CLI
        run: |
          pnpm --filter nativra-cli typecheck
          pnpm --filter nativra-cli test

      - name: Pack CLI tarball and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd packages/cli
          TGZ=$(npm pack --silent)
          cd ../..
          node scripts/extract-release-notes.mjs "$TAG" /tmp/release-notes.md
          TITLE=$(cat /tmp/release-title.txt 2>/dev/null || echo "$TAG")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "packages/cli/$TGZ" "dist/registry/registry.json" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md
          else
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "packages/cli/$TGZ" "dist/registry/registry.json" --clobber
          fi

      - name: Prepare package.json for GitHub Packages (@imdvlpr99/nativra-cli)
        working-directory: packages/cli
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@imdvlpr99/nativra-cli";
            pkg.publishConfig = {
              registry: "https://npm.pkg.github.com",
              access: "public"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Publish to GitHub Packages
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          # Re-runs of an already published version are skipped explicitly; any other failure fails the job.
          if npm view "@imdvlpr99/nativra-cli@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@imdvlpr99/nativra-cli@$VERSION is already published; skipping."
          else
            pnpm publish --no-git-checks
          fi

  # Publishes nativra-cli to npmjs.com with a provenance attestation, using npm trusted publishing
  # (OIDC, no long-lived token). Off until a trusted publisher is configured for nativra-cli on
  # npmjs.com (repo Imdvlpr99/Nativra, workflow publish-github-package.yml) and the repository
  # variable NPM_TRUSTED_PUBLISHING is set to "true".
  publish-npm:
    name: Publish nativra-cli to npm (provenance)
    needs: publish-gpr
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.21.1
      # This job can mint an npm publish token (id-token: write), so no dependency's install
      # script may run here. The CLI build (tsup/esbuild) doesn't need any.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter "nativra-cli..." build
      - name: Publish
        working-directory: packages/cli
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "nativra-cli@$VERSION" version >/dev/null 2>&1; then
            echo "nativra-cli@$VERSION is already on npm; skipping."
            exit 0
          fi
          # pnpm pack rewrites workspace: specifiers; npm publishes the tarball with provenance.
          TGZ=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$TGZ" --provenance --access public

  # Publishes nativra-mcp to npmjs.com with provenance, after nativra-cli: the MCP server depends
  # on the nativra-cli version released with it. Off until a trusted publisher is configured for
  # nativra-mcp on npmjs.com (same repo and workflow) and the repository variable
  # NPM_MCP_TRUSTED_PUBLISHING is set to "true".
  publish-mcp-npm:
    name: Publish nativra-mcp to npm (provenance)
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_MCP_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.21.1
      # This job can mint an npm publish token (id-token: write), so no install script may run.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter "nativra-mcp..." build
      - name: Publish
        working-directory: packages/mcp
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match packages/mcp/package.json version $VERSION"
            exit 1
          fi
          if npm view "nativra-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "nativra-mcp@$VERSION is already on npm; skipping."
            exit 0
          fi
          # pnpm pack turns "nativra-cli": "workspace:^" into "^$VERSION".
          TGZ=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$TGZ" --provenance --access public
